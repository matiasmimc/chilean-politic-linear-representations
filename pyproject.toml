[project]
name = "chilean-politic-linear-representations"
version = "0.1.0"
requires-python = ">= 3.12.3"
dependencies = [
    "pandas==2.2.1",
    "numpy==1.26.4",
    "torch>=2.1.0",
    "tqdm>=4.67.3",
    "einops>=0.8.2",
    "transformers>=5.9.0",
    "baukit",
    "scikit-learn>=1.8.0",
    "accelerate>=1.13.0",
    "pyarrow>=24.0.0",
    "bitsandbytes>=0.49.2",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "hydra-core>=1.3.7",
    "dotenv>=0.9.9",
]

[tool.uv.sources]
baukit = { git = "https://github.com/davidbau/baukit" }
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
